<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111417">
  <title>Tmux Desk</title>
  <link rel="stylesheet" href="./assets/xterm.css">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div id="app">

    <section id="view-list" class="view">
      <header class="topbar">
        <h1 class="topbar-title">Tmux Desk</h1>
        <div class="topbar-actions">
          <button id="theme-btn-list" class="icon-btn theme-btn" aria-label="切换主题" type="button">&#x263E;</button>
          <button id="refresh-btn" class="icon-btn" aria-label="刷新" type="button">&#x21bb;</button>
        </div>
      </header>
      <nav id="workspace-filters" class="workspace-filters" aria-label="会话工作区"></nav>
      <div id="list-content" class="list-content">
        <ul id="session-list" class="session-list"></ul>
        <div id="list-empty" class="state-message" hidden>
          <p>暂无 tmux 会话</p>
        </div>
        <div id="list-loading" class="state-message">
          <p>加载中&hellip;</p>
        </div>
        <div id="list-error" class="state-message" hidden>
          <p id="list-error-text">加载失败</p>
          <button id="list-retry-btn" class="btn" type="button">重试</button>
        </div>
      </div>
    </section>

    <section id="view-terminal" class="view" hidden>
      <div id="disconnect-banner" class="banner" hidden>
        <span>连接已断开</span>
        <button id="reconnect-btn" class="btn btn-sm" type="button">重连</button>
      </div>
      <header class="term-topbar">
        <button id="back-btn" class="icon-btn" aria-label="返回" type="button">&#x2039;</button>
        <span id="term-title" class="term-title"></span>
        <button id="theme-btn-term" class="icon-btn theme-btn" aria-label="切换主题" type="button">&#x263E;</button>
        <select id="window-picker" class="window-picker" aria-label="tmux 窗口" hidden></select>
      </header>
      <div id="terminal-container" class="terminal-container"></div>
      <div id="toolbar" class="toolbar">
        <button class="key-btn" data-key="esc" type="button">Esc</button>
        <button class="key-btn" data-key="tab" type="button">Tab</button>
        <button id="ctrl-btn" class="key-btn" data-key="ctrl" type="button">Ctrl</button>
        <button class="key-btn" data-key="prefix" type="button">&#x2303;B</button>
        <button class="key-btn" data-key="ctrl-c" type="button">&#x2303;C</button>
        <button class="key-btn" data-key="left" type="button">&#x2190;</button>
        <button class="key-btn" data-key="down" type="button">&#x2193;</button>
        <button class="key-btn" data-key="up" type="button">&#x2191;</button>
        <button class="key-btn" data-key="right" type="button">&#x2192;</button>
        <button id="copy-btn" class="key-btn" type="button" aria-label="选择并复制终端内容">&#x29C9;</button>
        <button id="keyboard-btn" class="key-btn" type="button" aria-label="呼出键盘">&#x2328;</button>
      </div>
    </section>

    <div id="session-tags-modal" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="session-tags-title" hidden>
      <form id="session-tags-form" class="sheet-panel">
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="sheet-header">
          <div>
            <h2 id="session-tags-title">管理 Tag</h2>
            <p id="session-tags-message"></p>
          </div>
        </header>
        <div id="session-tags-list" class="tag-check-list"></div>
        <footer class="sheet-footer">
          <button id="session-tags-cancel" class="btn secondary" type="button">取消</button>
          <button id="session-tags-save" class="btn primary" type="submit">保存</button>
        </footer>
      </form>
    </div>

    <div id="copy-modal" class="copy-backdrop" role="dialog" aria-modal="true" aria-labelledby="copy-modal-title" hidden>
      <div class="copy-panel">
        <header class="copy-header">
          <h2 id="copy-modal-title">选择并复制</h2>
          <button id="copy-modal-close" class="btn secondary btn-sm" type="button">关闭</button>
        </header>
        <pre id="copy-modal-text" class="copy-text"></pre>
        <footer class="copy-footer">
          <button id="copy-modal-selectall" class="btn primary" type="button">全选复制</button>
        </footer>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

  </div>
  <script src="./assets/app.js"></script>
</body>
</html>
