name: Release

# Build, sign (Developer ID), notarize, and staple the desktop app for every
# platform, then attach the installers to a GitHub Release.
#
# Trigger: push a version tag, e.g.  git tag v0.4.0 && git push origin v0.4.0
# Or trigger manually from the Actions tab (workflow_dispatch).
#
# ── Required GitHub Secrets ──────────────────────────────────────────────────
# APPLE_DEVELOPER_ID_CERT_BASE64    base64 of the .p12 Developer ID cert
# APPLE_DEVELOPER_ID_CERT_PASSWORD  .p12 password
# APPLE_API_KEY_P8                  CONTENTS of the App Store Connect .p8 file
# APPLE_API_KEY_ID                  Key ID (e.g. 687H76CDXR)
# APPLE_API_ISSUER_ID               Issuer UUID
# APPLE_TEAM_ID                     Team ID (e.g. D2U492GTU7)
#
# To create the cert secret on your Mac:
#   security find-identity -v -p codesigning | grep "Developer ID Application"
#   # Export it:
#   security export-identity -p "Developer ID Application: ..." -o cert.p12
#   # (enter a strong password, then base64-encode):
#   base64 -i cert.p12 | pbcopy  →  paste into GitHub Secret
#   # The .p8 file:
#   cat ~/.appstoreconnect/private_keys/AuthKey_687H76CDXR.p8 | pbcopy
#   →  paste into APPLE_API_KEY_P8 secret

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Fail fast if a step hangs (e.g. notarytool waiting on a backed-up Apple
    # notary service) instead of burning up to GitHub's 6h default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            script: release:mac
          - name: macOS x64
            # Intel runner — node-pty's native module is built for the runner's arch.
            os: macos-15-intel
            script: release:mac:x64
          - name: Windows x64
            os: windows-latest
            script: package:win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/sync-release-version.js

      - name: Install dependencies
        run: npm ci

      # ── macOS code signing + notarization setup ──────────────────────────
      - name: Setup code signing (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          P8_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN_NAME=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          # Put the build keychain on the search list so `security find-identity`
          # (used by afterpack-adhoc.js) actually SEES the imported Developer ID.
          # Without this the signing hook finds no cert and would ad-hoc sign,
          # which later fails notarization as "Invalid".
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain
          # Stop the keychain from auto-locking mid-build (long notarize waits).
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"

          echo "$CERT_BASE64" | base64 --decode > cert.p12
          security import cert.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun
          rm cert.p12

          # Allow codesign to access the private key without prompting
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,com.apple.notarytool: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          # Write notarization API key to the default path
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$P8_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_687H76CDXR.p8

          echo "✓ Keychain ready"

      # ── Build + package + sign + notarize ────────────────────────────────
      - name: Build and release (macOS)
        if: runner.os == 'macOS'
        run: npm run ${{ matrix.script }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
