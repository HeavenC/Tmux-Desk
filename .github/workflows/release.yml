name: Release

# Build the desktop app for every platform and attach the installers to a
# GitHub Release. Push a version tag to trigger it:
#   git tag v0.4.0 && git push origin v0.4.0
# Windows is built on a Windows runner and macOS arm64 / x64 on their own
# native runners, because node-pty is a native module that must be compiled on
# the target architecture — it can't be cross-produced from a single machine.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            script: package:mac
          - name: macOS x64
            os: macos-13
            script: package:mac:x64
          - name: Windows x64
            os: windows-latest
            script: package:win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run ${{ matrix.script }}
        env:
          # Do not attempt code signing / notarization in CI. macOS artifacts
          # are ad-hoc signed by scripts/afterpack-adhoc.js.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
